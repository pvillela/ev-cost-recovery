name: Release Binaries
on:
  push:
    tags: [ 'v*' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Pinned rather than `ubuntu-latest`: glibc is only backward compatible, so the binary
          # runs on the build image's release and newer, never older. 22.04 is the oldest release
          # we support, and building there is what makes the result run everywhere above it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
        #   - os: macos-latest
        #     target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      # The stamp every download carries: `v0_1_0_rc-1a2b3c` from tag `v0.1.0-rc` at that commit.
      # It comes from the tag rather than the manifest because the tag is what names the release,
      # and the two are compared here so a tag pushed against a stale `version =` fails the build
      # instead of shipping a binary whose name and contents disagree. `shell: bash` on Windows
      # too, so both legs of the matrix compute the same string.
      - name: Compute the release stamp
        id: stamp
        shell: bash
        run: |
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "stamp=${GITHUB_REF_NAME//[.-]/_}-${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
      # The app opens files through rfd's GTK backend on Linux (see Cargo.toml), which compiles
      # against GTK's headers. The runner image does not carry them, and without them the build
      # fails rather than falling back to anything.
      - name: Install GTK development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Ahead of the build so a failure stops the release before any artifact is uploaded.
      # Both configurations, because one does not cover the other: `historic` gates whole targets,
      # so running only with the feature never exercises the default build, and running only
      # without it never compiles the two historic binaries.
      - name: Run tests
        run: |
          cargo test --verbose
          cargo test --verbose --features historic
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Before the build, and not optional: `build.rs` refuses to compile a release whose notices
      # are missing or stamped with a different dependency graph. The file is not committed, so
      # this is the only place it exists.
      - name: Generate third-party notices
        shell: bash
        run: bash scripts/gen-notices.sh
      - name: Run Build
        run: cargo build --release --target ${{ matrix.target }} --verbose
      # The licences travel with the download, not only inside the binary, so the terms can be
      # read without running the program. Staged in `dist` because `upload-artifact` roots the
      # archive at the common ancestor of its inputs: handing it the binary under `target` and
      # the licences from the root would nest everything under the build path.
      - name: Stage the download (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ev_cost_recovery \
            dist/ev_cost_recovery-${{ steps.stamp.outputs.stamp }}
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md dist/
      - name: Stage the download (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/ev_cost_recovery.exe `
            dist/ev_cost_recovery-${{ steps.stamp.outputs.stamp }}.exe
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.md dist/
      # `upload-artifact` zips its inputs and drops the Unix mode bits, so an uploaded binary
      # arrives without its executable bit. Tarring first carries the mode through ourselves.
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: >
          tar -czf
          ev_cost_recovery-${{ matrix.target }}-${{ steps.stamp.outputs.stamp }}.tar.gz
          -C dist .
      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}-${{ steps.stamp.outputs.stamp }}
          path: ev_cost_recovery-${{ matrix.target }}-${{ steps.stamp.outputs.stamp }}.tar.gz
      # No tarball on Windows: nothing there depends on a permission bit surviving the trip, so
      # the zip `upload-artifact` makes on its own is enough. That zip is named after the artifact,
      # which is why the stamp has to be on `name` here and not only on the file inside.
      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}-${{ steps.stamp.outputs.stamp }}
          path: dist/*


