name: CI

# Every push and every pull request. The release workflow runs on tags alone, so without this one
# a broken test, a clippy warning or a rotted intra-doc link would be discovered when a release
# was tagged — and the examples would be compiled by nothing at all.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test, lint and document
    # Pinned to the same image the release is built on, so a failure here and a failure there are
    # the same failure. See the release workflow for why 26.04 rather than `ubuntu-latest`.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Warnings are errors here: a warning that nobody sees is a warning that accumulates. This is
      # also the only job that compiles the examples, benches and test targets.
      - name: Lint every target and feature
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test every target and feature
        run: cargo test --all-targets --all-features
      # The documentation checks, which are `#[ignore]`d so that the release workflow's `cargo
      # test` cannot reach `docs/`. Asking for them here is what makes them run, and this is the
      # only place that does.
      #
      # `#[ignore]` marks two populations, and only one of them belongs on a runner. The other
      # reads real customer documents under `data/` that are not in the repository, so there it
      # could only report its own absence — and the harness has no skip outcome, so the only ways
      # to do that are a failure or a pass that says nothing. Those are run by hand, on a machine
      # that has the data.
      #
      # Hence the second line names its test: `--ignored` alone would run the whole `integration`
      # target's ignored set, data-dependent half included. The first line needs no name, because
      # every test in `docs_errors` is a documentation check.
      - name: Check the documents against the code
        run: |
          cargo test --test docs_errors -- --ignored
          cargo test --test integration -- --ignored the_documented_site_load_table_matches_the_golden
      # The cheapest rename detector the crate has: a broken intra-doc link is a `warning`, not an
      # error, so without these flags `cargo doc` would stay green while a type lost its only path.
      #
      # `--document-private-items` because most of this crate is not `pub`, and without it the
      # check sees none of those links; `private_intra_doc_links` because a public item linking to
      # a private one is the shape that left `ReadError` unreachable with `cargo check` green.
      - name: Check the intra-doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
        run: cargo doc --no-deps --all-features --document-private-items
