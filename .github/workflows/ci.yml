name: CI

# Every push and every pull request. The release workflow runs on tags alone, so until this one
# existed a broken test, a clippy warning or a rotted intra-doc link was discovered when a release
# was tagged — and the examples were compiled by nothing at all.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test, lint and document
    # Pinned to the same image the release is built on, so a failure here and a failure there are
    # the same failure. See the release workflow for why 22.04 rather than `ubuntu-latest`.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # The app opens files through rfd's GTK backend on Linux (see Cargo.toml), which compiles
      # against GTK's headers. Without them the build fails rather than falling back to anything.
      - name: Install GTK development files
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Warnings are errors here: a warning that nobody sees is a warning that accumulates. This is
      # also the only job that compiles the examples, benches and test targets.
      - name: Lint every target and feature
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test every target and feature
        run: cargo test --all-targets --all-features
      # The ignored set is not run here. Both `#[ignore]`d tests read real customer documents that
      # are not in the repository, so on a runner they can only report their own absence — and the
      # harness has no skip outcome, so the only ways to do that are a failure or a pass that says
      # nothing. They are run by hand, by name, on a machine that has the data.
      # The cheapest rename detector the crate has: a broken intra-doc link is a `warning`, not an
      # error, so without this flag `cargo doc` would stay green while a type lost its only path.
      - name: Check the intra-doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps --all-features
