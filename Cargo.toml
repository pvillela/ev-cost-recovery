[package]
name = "ev_cost_recovery"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Supports calculation of net impact of EV charging activity on building's electrical costs."

[dependencies]
csv = "1.4.0"
eframe = "0.36.1"
# Used by eframe, block infected version 0.3.10.
arrayref = "=0.3.9"
egui_extras = { version = "0.36.1", features = ["datepicker"] }
jiff = "0.2.35"
# Object-level PDF access rather than a text extractor: a Toronto Hydro bill is a form whose
# labels and values are separately positioned runs of text, so reading it needs where each run
# sits, which plain-text extraction discards. Also carries the ToUnicode CMap decoding the bills
# need -- their fonts are subset Identity-H, where a glyph code means nothing without it.
lopdf = { version = "0.44.0", default-features = false }
# Whole-document tree rather than a streaming reader: the ESPI join needs random access, since an
# IntervalBlock resolves to its ReadingType only through a MeterReading entry that may appear
# anywhere in the feed.
roxmltree = "0.21.1"
# The file dialogs. `rfd` asks for the platform's own on every target: the XDG desktop portal on
# Linux, where the desktop puts up its dialog in its own process, and the native dialog elsewhere.
# One dependency line therefore serves every target, and the Linux binary links no desktop toolkit
# at all -- neither GTK nor Qt appears in `ldd`, and building needs no development package.
#
# The portal is a service rather than a library, so the machine running the app has to be running
# one; every desktop environment does. Where none is, the dialog does not open and the rest of the
# app still runs. `OpenFile` gained `current_folder` in xdg-desktop-portal 1.17, so a service older
# than that opens in its own default folder rather than the one the app names -- Ubuntu 22.04
# ships 1.14, and 26.04 ships 1.21.
rfd = "0.17.2"
# Stores row heights and column widths as f64 written straight through, which is what lets this
# reproduce the reference workbook exactly. rust_xlsxwriter models both as whole pixels and cannot
# represent the template's 13.8pt rows or 1.39-wide spacers.
umya-spreadsheet = "3.0.1"

[build-dependencies]
# Verifies that the generated third-party notices match the dependency graph they were made from.
# Already in the graph transitively, so this compiles nothing new, and `ignore-build-dependencies`
# in `about.toml` keeps it out of the notices it guards.
sha2 = "0.11.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.dev]
# Full DWARF is around 80% of the dev binary, and the egui dependency tree makes that hundreds of
# megabytes. Line tables alone still name the file and line of every frame in a backtrace, which is
# all the debug info this crate's development actually uses.
debug = "line-tables-only"

[profile.release]
# The app is downloaded as a single file, so the debug symbols are worth removing: they are most
# of the binary and nothing in the field reads them.
strip = "symbols"
